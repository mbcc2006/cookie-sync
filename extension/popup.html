<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CookieSync</title>
  <style>
    body { font: 14px sans-serif; margin: 16px; min-width: 360px; color: #13251d; background: #fbf8ef; }
    label, input, select, button { display: block; width: 100%; box-sizing: border-box; margin: 8px 0; }
    button { padding: 8px; }
    #status { white-space: pre-wrap; }
    .audit-head { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #ccc; margin-top: 16px; padding-top: 12px; }
    .audit-head button { width: auto; padding: 5px 9px; margin: 0; }
    #audit { max-height: 260px; overflow: auto; margin-top: 8px; }
    .event { border-left: 3px solid #88958e; padding: 7px 9px; margin: 7px 0; background: white; font-size: 12px; }
    .event.approved, .event.auto-approved, .event.consumed { border-color: #4d8f38; }
    .event.denied, .event.expired { border-color: #d45a34; }
    .event b, .event time, .event small { display: block; }
    .event time, .event small { color: #66736c; margin-top: 3px; }
  </style>
</head>
<body>
  <strong>CookieSync</strong>
  <label><span data-i18n="label.language">Language</span>
    <select id="lang">
      <option value="en">English</option>
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
    </select>
  </label>
  <label><span data-i18n="label.relay">Relay URL</span><input id="relay" value="https://relay.ivjn.us" disabled></label>
  <label id="pair-code-label"><span data-i18n="label.pairCode">Pair code</span><input id="code" placeholder="ABC123..."></label>
  <label><span data-i18n="label.policy">CLI 读取 Cookie</span>
    <select id="policy">
      <option value="notify" data-i18n="policy.notify">默认允许，但通知提示</option>
      <option value="confirm" data-i18n="policy.confirm">每次都需要确认</option>
    </select>
  </label>
  <button id="sync" data-i18n="button.sync.authorize">Authorize and sync all permitted domains</button>
  <button id="revoke" hidden data-i18n="button.revoke">取消授权</button>
  <p id="status"></p>
  <section id="audit-section" hidden>
    <div class="audit-head"><strong data-i18n="audit.title">Cookie 读取审计</strong><button id="refresh-audit" data-i18n="audit.refresh">刷新</button></div>
    <div id="audit"><p data-i18n="audit.empty">暂无访问记录。</p></div>
  </section>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
